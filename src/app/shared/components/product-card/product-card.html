<div
  class="group rounded-xl border border-gray-200 bg-white p-3 transition hover:border-indigo-300 hover:shadow-sm"
>
  <!-- Image -->
  <div class="mb-3 flex h-28 items-center justify-center overflow-hidden rounded-lg bg-gray-50">
    <img
      [src]="
        product.image ? environment.fileUrl + product.image : 'assets/images/image_not_found.jpg'
      "
      [alt]="product.name"
      class="h-full w-full object-contain transition-transform duration-200"
    />
  </div>

  <!-- Product Info -->
  <div>
    <h3 class="truncate text-sm font-medium text-gray-900">
      {{ product.name }}
    </h3>

    <p class="mt-1 text-xs text-gray-400">SKU: {{ product.sku }}</p>

    <div class="mt-3 flex items-center justify-between">
      <span class="text-lg font-semibold text-gray-900">
        {{ product.sellingPrice | currency }}
      </span>

      <span
        class="text-xs font-medium"
        [class.text-green-600]="product.stockQty > product.lowStockAlert"
        [class.text-red-500]="product.stockQty <= product.lowStockAlert"
      >
        @if (product.stockQty <= product.lowStockAlert) {
          Low stock
        } @else {
          {{ product.stockQty | number }} in stock
        }
      </span>
    </div>

    <!-- Add -->
    <button
      type="button"
      [disabled]="product.stockQty <= 0"
      (click)="addToCart.emit(product)"
      class="mt-3 flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400 cursor-pointer"
    >
      <lucide-icon [img]="icons.ShoppingCart" size="16"></lucide-icon>
      Add to Cart
    </button>
  </div>
</div>
