<div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
  <div class="mb-4 flex h-32 items-center justify-center overflow-hidden rounded-lg bg-gray-50 p-2">
    <img
      [src]="
        product.image ? environment.fileUrl + product.image : 'assets/images/image_not_found.jpg'
      "
      [alt]="product.name"
      class="h-full w-full object-contain"
    />
  </div>

  <h3 class="font-medium text-gray-800">
    {{ product.name }}
  </h3>

  <p class="mt-1 text-sm text-gray-500">Stock: {{ product.stockQty }}</p>

  <p class="mt-2 text-lg font-semibold text-indigo-600">${{ product.sellingPrice }}</p>

  <button
    type="button"
    (click)="addToCart.emit(product)"
    class="mt-4 w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 cursor-pointer"
  >
    Add to Cart
  </button>
</div>
