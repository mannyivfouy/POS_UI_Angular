<header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6">

  <!-- Search -->
  <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 w-80">
    <span class="text-gray-400">🔍</span>
    <input
      type="text"
      placeholder="Search analytics or orders..."
      class="bg-transparent outline-none text-sm w-full placeholder-gray-400"
    />
  </div>

  <!-- Right side -->
  <div class="flex items-center gap-4">
    <button class="relative text-gray-500 hover:text-gray-700">
      🔔
      <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
    </button>
    <button class="text-gray-500 hover:text-gray-700">❓</button>

    <div class="flex items-center gap-2 pl-3 border-l border-gray-200">
      <div class="w-9 h-9 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs font-semibold overflow-hidden">
        {{ user?.fullname?.charAt(0) || 'U' }}
      </div>
      <div class="text-right hidden sm:block">
        <p class="text-sm font-medium text-gray-800 leading-tight">{{ user?.fullname }}</p>
        <p class="text-xs text-blue-500 leading-tight">{{ user?.role?.name }}</p>
      </div>
    </div>
  </div>

</header>
