@if (open || closing) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/30 backdrop-blur-sm animate__animated"
    [class.animate__fadeIn]="!closing"
    [class.animate__fadeOut]="closing"
  >
    <div
      class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl animate__animated animate__faster"
      [class.animate__zoomIn]="!closing"
      [class.animate__zoomOut]="closing"
      (animationend)="onAnimationEnd()"
    >
      <h2 class="text-lg font-semibold text-gray-900">
        {{ title }}
      </h2>

      <p class="mt-2 text-sm text-gray-500">
        {{ message }}
      </p>

      <div class="mt-6 flex justify-end gap-3">
        @if (showCancel) {
          <button
            type="button"
            (click)="onCancel()"
            class="rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200 cursor-pointer"
          >
            {{ cancelText }}
          </button>
        }

        <button
          type="button"
          (click)="onConfirm()"
          [class]="
            'rounded-lg px-4 py-2 text-sm font-medium text-white cursor-pointer ' +
            confirmButtonClass
          "
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
