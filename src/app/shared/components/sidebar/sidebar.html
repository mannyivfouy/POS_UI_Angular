<aside class="w-64 h-full flex flex-col bg-white border-r border-gray-200">
  <div class="h-16 flex items-center px-5 border-b border-gray-100">
    <div>
      <h1 class="text-lg font-bold text-blue-600 leading-tight">Precision POS</h1>
      <span class="text-[11px] text-gray-400">v2.4.0</span>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto p-3 space-y-0.5">
    <a
      *ngFor="let item of filteredMenu"
      [routerLink]="item.route"
      routerLinkActive="bg-blue-50 text-blue-600 font-medium"
      [routerLinkActiveOptions]="{ exact: false }"
      class="relative flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-colors"
    >
      <lucide-icon [img]="item.icon" class="w-5 h-5 shrink-0"></lucide-icon>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="px-3 pb-4 pt-3 border-t border-gray-100">
    <div class="flex items-center gap-3 px-2 py-2 mb-2">
      <div
        class="w-9 h-9 rounded-full overflow-hidden bg-gray-200 flex items-center justify-center"
      >
        <img
          *ngIf="user?.avatar"
          [src]="user.avatar"
          class="w-full h-full object-cover"
          alt="User avatar"
        />

        <span
          *ngIf="!user?.avatar"
          class="text-white text-xs font-semibold bg-blue-600 w-full h-full flex items-center justify-center"
        >
          {{ user?.fullname?.charAt(0) || '' }}
        </span>
      </div>
      <div class="leading-tight min-w-0">
        <p class="text-sm font-semibold text-gray-800 truncate">{{ user?.fullname }}</p>
        <p class="text-xs text-gray-400">{{ user?.roleId?.name }}</p>
      </div>
    </div>
    <button
      (click)="logout()"
      class="w-full py-2.5 rounded-lg text-sm font-semibold text-white bg-pink-600 hover:bg-pink-700 transition-colors"
    >
      Logout
    </button>
  </div>
</aside>
