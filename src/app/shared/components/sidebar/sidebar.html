<aside
  class="h-full flex flex-col bg-white border-r border-gray-200 transition-all duration-300"
  [class.w-64]="isOpen"
  [class.w-20]="!isOpen"
>
  <div class="h-16 flex items-center px-5">
    <div>
      <!-- <h1 class="text-lg font-bold text-indigo-600 leading-tight">Precision POS</h1> -->
      <div class="text-center flex items-center">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-md">
          <svg lucideWarehouse class="w-6 h-6 text-white"></svg>
        </div>

        <h1 class="ml-4 text-xl font-bold text-indigo-600" *ngIf="isOpen">Precision POS</h1>
      </div>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto p-3 space-y-0.5">
    <a
      *ngFor="let item of filteredMenu"
      [routerLink]="item.route"
      routerLinkActive="bg-indigo-100 text-indigo-600 font-medium"
      [routerLinkActiveOptions]="{ exact: false }"
      #rla="routerLinkActive"
      [class.hover:bg-gray-50]="!rla.isActive"
      [class.hover:text-gray-700]="!rla.isActive"
      class="relative flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-500 transition-colors"
      [class.justify-center]="!isOpen"
      [class.gap-3]="isOpen"
      [class.px-4]="isOpen"
      ><span
        *ngIf="rla.isActive"
        class="absolute right-0 top-1/2 -translate-y-1/2 h-7 w-1 rounded-l-full bg-indigo-600"
      ></span>
      <lucide-icon [img]="item.icon" class="w-5 h-5 shrink-0"></lucide-icon>
      <span *ngIf="isOpen">
        {{ item.labelKey | translate }}
      </span>
    </a>
  </nav>

  <div class="px-3 pb-4 pt-3 border-t border-gray-200">
    <div class="flex items-center gap-3 px-2 py-2 mb-2">
      <div
        class="w-9 h-9 rounded-full border-2 border-indigo-600 overflow-hidden bg-gray-200 flex items-center justify-center"
      >
        <img
          *ngIf="user?.avatar"
          [src]="user.avatar"
          class="w-full h-full object-cover"
          alt="User avatar"
        />

        <span
          *ngIf="!user?.avatar"
          class="text-white text-xs font-semibold bg-indigo-600 w-full h-full flex items-center justify-center"
        >
          {{ user?.fullname?.charAt(0) || '' }}
        </span>
      </div>
      <div class="leading-tight min-w-0" *ngIf="isOpen">
        <p class="text-sm font-semibold text-gray-800 truncate">{{ user?.fullname }}</p>
        <p class="text-xs text-gray-400">{{ user?.roleId?.name }}</p>
      </div>
    </div>
    <button
      (click)="logout()"
      class="w-full py-2.5 rounded-lg text-sm font-semibold text-white bg-pink-600 hover:bg-pink-700"
    >
      <span *ngIf="isOpen"> Logout </span>
      <lucide-icon *ngIf="!isOpen" [img]="LogOut" class="w-5 h-5 mx-auto"></lucide-icon>
    </button>
  </div>
</aside>
