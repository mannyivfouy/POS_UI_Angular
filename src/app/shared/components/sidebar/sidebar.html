<aside class="bg-white border-r w-64 h-full flex flex-col">
  <!-- Logo -->
  <div class="h-16 flex items-center justify-center border-b">
    <h1 class="text-xl font-bold text-blue-600">POS System</h1>
  </div>

  <!-- Menu -->
  <nav class="flex-1 p-3 space-y-1">
    <a
      *ngFor="let item of filteredMenu"
      [routerLink]="item.route"
      routerLinkActive="bg-blue-100 text-blue-600"
      class="block px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100"
    >
      {{ item.label }}
    </a>
  </nav>

  <!-- Logout -->
  <div class="p-3 border-t">
    <button
      (click)="logout()"
      class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg"
    >
      Logout
    </button>
  </div>
</aside>
