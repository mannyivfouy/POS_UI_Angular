<div
  *ngIf="data"
  class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center justify-between hover:shadow-md transition"
>
  <!-- LEFT -->
  <div>
    <p class="text-sm text-gray-500">
      {{ data.titleKey | translate }}
    </p>

    <h2 class="text-2xl font-bold text-gray-800 mt-1">
      {{ data.value }}
    </h2>

    <!-- TREND -->
    <div *ngIf="data.trend" class="flex items-center gap-2 mt-2 text-xs">
      <span
        class="px-2 py-0.5 rounded-full font-medium flex items-center gap-2"
        [ngClass]="{
          'bg-green-100 text-green-600': data.trend.direction === 'up',
          'bg-red-100 text-red-600': data.trend.direction === 'down',
          'bg-gray-100 text-gray-500': data.trend.direction === 'neutral',
        }"
      >
        <lucide-angular [img]="getTrendIcon(data.trend.direction)" class="w-5 h-5">
        </lucide-angular>
        {{ data.trend.value }}%
      </span>

      <span class="text-gray-400">
        {{ data.trend.label }}
      </span>
    </div>
  </div>

  <!-- ICON -->
  <div
    class="w-11 h-11 rounded-xl flex items-center justify-center"
    [ngClass]="{
      'bg-indigo-100 text-indigo-600': data.iconColor === 'indigo',
      'bg-green-100 text-green-600': data.iconColor === 'green',
      'bg-red-100 text-red-600': data.iconColor === 'red',
      'bg-orange-100 text-orange-600': data.iconColor === 'orange',
    }"
  >
    <lucide-angular [img]="data.icon" class="w-6 h-6"> </lucide-angular>
  </div>
</div>
