@if (open) {
  <!-- Overlay -->
  <div class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40" (click)="onClose()"></div>

  <!-- Drawer -->
  <div class="fixed top-0 right-0 h-full w-250 bg-white shadow-2xl z-50 flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b">
      <h2 class="text-lg font-semibold">
        {{ title }}
      </h2>

      <button class="text-gray-500 hover:text-black" (click)="onClose()">✕</button>
    </div>

    <!-- Body -->
    <div class="p-5 overflow-y-auto flex-1">
      <ng-content></ng-content>
    </div>
  </div>
}
