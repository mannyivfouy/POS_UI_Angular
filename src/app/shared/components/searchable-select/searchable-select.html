<div class="relative w-full">
  <!-- Select Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    class="w-full h-10 px-3 flex items-center justify-between rounded-lg border text-sm text-gray-700 bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-600 disabled:cursor-not-allowed disabled:opacity-60"
    [ngClass]="{
      'border-red-500 bg-red-50 text-red-600': invalid,
      'border-gray-200': !invalid,
    }"
  >
    <span class="truncate" [class.text-gray-400]="!selectedValue">
      {{ selectedLabel }}
    </span>

    <lucide-icon
      [img]="icons.ChevronDown"
      class="h-4 w-4 text-gray-400 transition-transform duration-200"
      [class.rotate-180]="isOpen"
    ></lucide-icon>
  </button>

  <!-- Dropdown -->
  <div
    *ngIf="isOpen"
    class="absolute z-50 mt-1 w-full rounded-lg border border-gray-200 bg-white shadow-lg"
  >
    <!-- Search -->
    <div class="p-2 border-b border-gray-100">
      <div class="relative">
        <lucide-icon
          [img]="icons.Search"
          class="absolute left-1 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"
        ></lucide-icon>

        <input
          type="text"
          [(ngModel)]="searchTerm"
          [placeholder]="'common.search' | translate: { type: searchType }"
          class="w-full rounded-md border border-gray-200 bg-gray-50 py-2 pl-9 pr-3 text-sm text-gray-700 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
          (click)="$event.stopPropagation()"
        />
      </div>
    </div>

    <!-- Options -->
    <div class="max-h-52 overflow-y-auto py-1">
      <button
        *ngFor="let item of filteredItems"
        type="button"
        (click)="selectItem(item)"
        class="w-full px-3 py-2 text-left text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 flex items-center justify-between"
      >
        <span>{{ item.name }}</span>

        <lucide-icon
          *ngIf="selectedValue === item._id"
          [img]="icons.Check"
          class="h-4 w-4 text-indigo-600"
        ></lucide-icon>
      </button>

      <!-- No Results -->
      <div *ngIf="filteredItems.length === 0" class="px-3 py-3 text-center text-sm text-gray-400">
        {{ 'common.no_result_found' | translate }}
      </div>
    </div>
  </div>
</div>
