<div *ngIf="visible" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div class="w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-2xl">

    <div class="relative overflow-hidden bg-red-600 py-4 text-center flex justify-center">
        <img src="assets/images/KHQR_Logo.png" alt="khqr" class="h-6 w-auto object-contain">
    </div>

    <!-- Merchant + amount -->
    <div class="px-5 pt-4">
      <p class="text-sm font-bold text-gray-500">{{ merchantName }}</p>
      <div class="mt-0.5 flex items-baseline gap-1.5">
        <span class="text-[26px] font-semibold text-gray-900">{{ formattedAmount }}</span>
        <span class="text-sm font-bold text-gray-500">{{ payment.currency }}</span>
      </div>
    </div>

    <div class="mt-4 border-t-2 border-dashed border-gray-300"></div>

    <div class="flex justify-center px-5 pb-1 pt-4">
      <div class="relative h-55 w-55">
        <qrcode
          [qrdata]="payment.qr"
          [width]="220"
          [errorCorrectionLevel]="'H'"
          [margin]="1"
        ></qrcode>
        <div
          class="absolute left-1/2 top-1/2 flex h-9 w-9 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-gray-900 ring-4 ring-white"
        >
          <span class="text-sm font-medium text-white">
            <lucide-icon [img]="icons.DollarSign" class="w-5 h-5 stroke-3"></lucide-icon>
          </span>
        </div>
      </div>
    </div>

    <!-- Expiry -->
    <div class="px-5 pb-1 pt-3 text-center">
      <p class="text-xs text-gray-500">
        Expires in <span class="font-medium text-gray-900">{{ formattedTime }}</span>
      </p>
    </div>

    <!-- Bill number -->
    <div class="mx-5 mt-4 flex items-center justify-between border-t border-gray-100 pt-3">
      <span class="text-xs text-gray-500">Bill number</span>
      <span class="text-xs font-medium text-gray-900">{{ payment.billNumber }}</span>
    </div>

    <!-- Footer -->
    <div class="px-5 pb-5 pt-4">
      <button
        type="button"
        class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-50 hover:text-gray-900 cursor-pointer"
        (click)="close()"
      >
        Cancel payment
      </button>
    </div>
  </div>
</div>
