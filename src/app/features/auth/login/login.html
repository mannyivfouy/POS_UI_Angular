<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div
        class="mx-auto w-14 h-14 bg-indigo-600 rounded-xl flex items-center justify-center shadow-md"
      >
        <svg lucideWarehouse class="w-7 h-7 text-white"></svg>
      </div>

      <h1 class="mt-4 text-3xl font-bold text-indigo-600">Precision POS</h1>
      <p class="text-gray-600 mt-1">Institutional grade retail management</p>
    </div>

    <!-- Card -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-lg p-8">
      <h2 class="text-lg font-semibold text-gray-800">System Access</h2>
      <p class="text-xs text-gray-600 uppercase tracking-wider mb-4">
        Administrator credentials required
      </p>

      <!-- ERROR MESSAGE -->
      <div *ngIf="errorMessage" class="mb-4 w-full p-2 rounded-lg bg-red-100 border border-red-600">
        <h1 class="text-md text-center text-red-600">
          {{ errorMessage }}
        </h1>
      </div>

      <!-- FORM -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <!-- Username -->
        <div>
          <span class="text-red-600">* </span>
          <label class="text-sm font-medium text-gray-700">Username</label>

          <div class="mt-1 relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg lucideUser class="w-4 h-4"></svg>
            </span>
            <input
              type="text"
              formControlName="username"
              placeholder="Johnson"
              [ngClass]="{
                'border-red-500 bg-red-50 text-red-600':
                  errorMessage || (form.get('username')?.touched && form.get('username')?.invalid),
                'border-gray-200 bg-gray-100 text-gray-900':
                  !errorMessage &&
                  !(form.get('username')?.touched && form.get('username')?.invalid),
              }"
              class="w-full pl-10 pr-3 py-2 border rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-600"
            />
          </div>

          <p
            *ngIf="form.get('username')?.touched && form.get('username')?.invalid"
            class="text-sm text-red-600 mt-1"
          >
            Username is required
          </p>
        </div>

        <!-- Password -->
        <div>
          <span class="text-red-600">* </span>
          <label class="text-sm font-medium text-gray-700">Password</label>

          <div class="mt-1 relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg lucideLock class="w-4 h-4"></svg>
            </span>

            <input
              [type]="isPasswordVisible ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              [ngClass]="{
                'border-red-500 bg-red-50 text-red-600':
                  errorMessage || (form.get('password')?.touched && form.get('password')?.invalid),
                'border-gray-200 bg-gray-100 text-gray-900':
                  !errorMessage &&
                  !(form.get('password')?.touched && form.get('password')?.invalid),
              }"
              class="w-full pl-10 pr-10 py-2 border rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-600"
            />

            <!-- toggle -->
            <span
              (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer"
            >
              <svg *ngIf="!isPasswordVisible" lucideEye class="w-4 h-4"></svg>
              <svg *ngIf="isPasswordVisible" lucideEyeOff class="w-4 h-4"></svg>
            </span>
          </div>

          <p
            *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
            class="text-sm text-red-600 mt-1"
          >
            Password is required
          </p>
        </div>

        <!-- Remember -->
        <div class="flex items-center space-x-2">
          <input
            type="checkbox"
            formControlName="remember"
            class="w-4 h-4 text-indigo-600 border-gray-300 rounded"
          />
          <label class="text-sm text-gray-600">Remember me</label>
        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg flex items-center justify-center transition cursor-pointer"
        >
          <svg lucideLogIn class="w-4 h-4 mr-2"></svg>
          <span *ngIf="!isLoading">SIGN IN</span>
          <span *ngIf="isLoading">Signing in...</span>
        </button>
      </form>

      <!-- FOOTER -->
      <div class="mt-6 border-t border-gray-600 pt-4 text-center space-y-2">
        <div class="text-xs text-gray-600 flex items-center justify-center gap-1">
          <svg lucideShield class="w-3 h-3"></svg>
          Secure 256-bit Encrypted Connection
        </div>

        <div class="text-xs text-gray-600 flex justify-center space-x-2">
          <span>Help Center</span>
          <span>•</span>
          <span>v 1.1.0</span>
        </div>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      Authorized access only. All sessions are logged and monitored.
    </p>
  </div>
</div>
