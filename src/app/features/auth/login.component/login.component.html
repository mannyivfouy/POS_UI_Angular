<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div
        class="mx-auto w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center shadow-md"
      >
        <svg lucideWarehouse class="w-7 h-7 text-white"></svg>
      </div>

      <h1 class="mt-4 text-3xl font-bold text-blue-600">Precision POS</h1>

      <p class="text-gray-500 mt-1">Institutional grade retail management</p>
    </div>

    <!-- Card -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-lg p-8">
      <!-- Title -->
      <div class="mb-6">
        <h2 class="text-lg font-semibold text-gray-800">System Access</h2>
        <p class="text-xs text-gray-500 uppercase tracking-wider">
          Administrator credentials required
        </p>
      </div>

      <form class="space-y-5">
        <!-- Username -->
        <div>
          <label class="text-sm font-medium text-gray-700">Username</label>

          <div class="mt-1 relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg lucideUser class="w-4 h-4"></svg>
            </span>

            <input
              type="text"
              placeholder="Enter your username"
              class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex justify-between items-center">
            <label class="text-sm font-medium text-gray-700">Password</label>
            <a href="#" class="text-xs text-blue-600 hover:underline">Forgot password?</a>
          </div>

          <div class="mt-1 relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg lucideLock class="w-4 h-4"></svg>
            </span>

            <input
              type="password"
              placeholder="••••••••"
              class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />

            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer">
              <svg lucideEye class="w-4 h-4"></svg>
            </span>
          </div>
        </div>

        <!-- Remember -->
        <div class="flex items-center space-x-2">
          <input type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded" />
          <label class="text-sm text-gray-600">Remember me</label>
        </div>

        <!-- Button -->
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg flex items-center justify-center space-x-2 transition"
        >
          <span>SIGN IN</span>
          <svg lucideLogIn class="w-5 h-5"></svg>
        </button>

        <!-- Footer -->
        <div class="mt-6 border-t pt-4 text-center space-y-2">
          <div class="text-xs text-gray-500 flex justify-center items-center space-x-2">
            <span>Secure 256-bit Encrypted Connection</span>
          </div>

          <div class="text-xs text-gray-500 flex justify-center space-x-2">
            <span>Help Center</span>
            <span>•</span>
            <span>v 1.0.0</span>
          </div>
        </div>
      </form>
    </div>

    <!-- Warning -->
    <p class="text-center text-xs text-gray-400 mt-6">
      Authorized access only. All sessions are logged and monitored for security compliance.
    </p>
  </div>
</div>
